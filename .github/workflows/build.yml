name: Build SentinelAI Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download Spigot API
      run: |
        wget -O spigot-api.jar https://cdn.codemc.io/jenkins/spigot/spigot-api/1.20.4-R0.1-SNAPSHOT/spigot-api-1.20.4-R0.1-SNAPSHOT.jar || \
        wget -O spigot-api.jar https://repo.maven.apache.org/maven2/org/spigotmc/spigot-api/1.20.4-R0.1-SNAPSHOT/spigot-api-1.20.4-R0.1-SNAPSHOT.jar || \
        echo "Download failed, trying alternative..." && ls -la

    - name: Compile Plugin
      working-directory: plugin
      run: |
        mkdir -p target/classes
        find src/main/java -name "*.java" > sources.txt
        javac -d target/classes -cp "../spigot-api.jar:../plugin/gson.jar" --release 17 @sources.txt || \
        javac -d target/classes -cp "../spigot-api.jar" --release 17 @sources.txt
        echo "Compilation done"

    - name: Copy Resources
      working-directory: plugin
      run: |
        cd target/classes
        cp -r ../../src/main/resources/* . 2>/dev/null || echo "No resources"
        ls -la

    - name: Create JAR
      working-directory: plugin
      run: |
        cd target/classes
        jar cfm ../SentinelAI-AntiCheat-1.0.0.jar META-INF/MANIFEST.MF .
        cd ..
        ls -la target/*.jar

    - name: Upload JAR artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: SentinelAI-Plugin
        path: plugin/target/*.jar
        retention-days: 90
